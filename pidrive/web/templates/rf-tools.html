{% extends "base.html" %}
{% block title %}PiDrive — RF / DAB Tools{% endblock %}
{% block content %}
<div class="card">
  <div class="card-title">📻 DAB+ Status
    <span id="snapRf" style="font-weight:normal;color:var(--muted);text-transform:none;letter-spacing:0;font-size:11px"></span>
  </div>
  <div id="dabStatusBlock" style="font-size:13px">Lade…</div>
  <div class="btn-row" style="margin-top:8px">
    <button class="btn" onclick="loadDabStatus()">Aktualisieren</button>
    <button class="btn" onclick="sendCmd('dab_scan')">DAB Scan</button>
  </div>
</div>
<div class="card">
  <div class="card-title">📡 RTL-SDR Diagnose</div>
  <div id="rtlsdrBlock" style="font-size:13px">Lade…</div>
  <div class="btn-row" style="margin-top:8px">
    <button class="btn" onclick="loadRtlsdr()">Status lesen</button>
    <button class="btn" onclick="resetRtlsdr()">Reset</button>
    <button class="btn" onclick="refreshRtlsdr()">Refresh</button>
  </div>
</div>
<div class="card">
  <div class="card-title">🔭 Spektrum-Snapshot</div>
  <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap">
    <input id="specCenter" placeholder="Mitte MHz" style="width:90px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:5px" value="446.1">
    <input id="specPpm" placeholder="PPM" style="width:60px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:5px" value="49">
    <input id="specGain" placeholder="Gain" style="width:60px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:5px" value="-1">
    <button class="btn primary" onclick="captureSpectrum()">📡 Snapshot</button>
    <button class="btn" onclick="loadSpectrumLast()">Letztes</button>
  </div>
  <canvas id="specCanvas" width="640" height="160" style="width:100%;max-width:640px;height:160px;background:#050d1a;border:1px solid var(--line-soft);display:none;margin-bottom:8px"></canvas>
  <pre id="specPre" style="background:#050d1a;padding:10px;font-size:11px;max-height:250px;overflow:auto;color:var(--text);white-space:pre-wrap;border:1px solid var(--line-soft)">–</pre>
</div>
<div class="card">
  <div class="card-title">🎛 PPM Kalibrierung</div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
    <input id="ppmVal" type="number" value="49" style="width:70px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:5px">
    <button class="btn" onclick="sendCmd('ppm:'+document.getElementById('ppmVal').value)">PPM setzen</button>
    <button class="btn" onclick="ppmCalibrate()">Auto-Kalibrieren</button>
  </div>
  <div id="ppmHint" style="font-size:11px;color:var(--muted);margin-top:6px"></div>
</div>
<div class="card">
  <div class="card-title">📊 DAB Scan Diagnose</div>
  <div id="dabScanBlock" style="font-size:13px">–</div>
  <button class="btn" onclick="loadDabScan()" style="margin-top:8px">Laden</button>
</div>
{% endblock %}
{% block extra_js %}
<script src="/static/js/page-rf-tools.js"></script><script>
async function loadDabStatus() {
  try{const r=await fetch('/api/dab/status');const j=await r.json();
    const d=j.data||{};
    document.getElementById('dabStatusBlock').innerHTML=`
      <b>Sender:</b> ${d.name||'–'} | <b>Kanal:</b> ${d.channel||'–'}<br>
      <b>State:</b> ${d.dab_state||d.state||'–'} | <b>PCM:</b> ${d.dab_pcm_seen?'✓':'✗'} | <b>Sync:</b> ${d.sync_ok?'✓':'✗'}<br>
      ${d.dab_attempting?'<span style="color:var(--yellow)">⏳ welle-cli läuft, kein stabiler Lock</span>':''}<br>
      <b>DLS:</b> ${d.last_dls_raw||d.dls_text||'–'} | Lines: ${d.dls_lines_seen??'–'}<br>
      <b>Fehler:</b> <span style="color:var(--red)">${d.last_error_line||d.dab_last_error||'–'}</span>`;
    const s=document.getElementById('snapRf');
    if (s) s.textContent = '· Stand ' + new Date().toLocaleTimeString();
  }catch(e){document.getElementById('dabStatusBlock').textContent='Fehler: '+e;}
}
async function loadRtlsdr() {
  try{
    const r=await fetch('/api/rtlsdr');
    const j=await r.json();
    const usb=(j.data&&j.data.usb)||{};
    const present=j.present!=null?j.present:!!usb.present;
    const usbId=j.usb_id||'–';
    const tools=Object.entries((j.data&&j.data.tools)||{}).map(([k,v])=>`${k}:${v?'✓':'✗'}`).join(' ');
    const hint=j.hint?`<div style="color:var(--yellow);margin-top:4px">${j.hint}</div>`:'';
    const err=j.error?`<div style="color:var(--red)">${j.error}</div>`:'';
    document.getElementById('rtlsdrBlock').innerHTML=
      `<b>Diagnose:</b> ${j.ok?'ok':'Fehler'} | <b>Stick:</b> ${present?'gefunden':'nicht gefunden'} | <b>USB ID:</b> ${usbId||'–'}<br>`+
      `<span style="color:var(--muted);font-size:11px">Tools: ${tools||'–'} · busy=${(j.data&&j.data.busy)?'ja':'nein'}</span>`+
      hint+err+
      `<pre style="font-size:10px;margin-top:6px">${JSON.stringify(j.data||{},null,2)}</pre>`;
  }catch(e){
    document.getElementById('rtlsdrBlock').textContent='Fehler: '+e;
  }
}
async function resetRtlsdr(){await sendCmd('rtlsdr_reset');showToast('Reset gesendet');}
async function refreshRtlsdr(){
  try{
    document.getElementById('rtlsdrBlock').textContent='Aktualisiere…';
    await fetch('/api/rtlsdr/refresh');
    await loadRtlsdr();
  }catch(e){document.getElementById('rtlsdrBlock').textContent='Fehler: '+e;}
}
async function captureSpectrum() {
  const c=document.getElementById('specCenter').value;
  const p=document.getElementById('specPpm').value;
  const g=document.getElementById('specGain').value;
  const pre=document.getElementById('specPre');
  pre.textContent='Erfasse Snapshot…';
  try{
    const url=`/api/spectrum/capture?mode=snapshot&center_mhz=${encodeURIComponent(c)}&ppm=${encodeURIComponent(p)}&gain=${encodeURIComponent(g)}`;
    const r=await fetch(url,{method:'POST'});
    const j=await r.json();
    renderSpectrumResult(j);
    if(!j.ok) showToast('Spektrum: '+(j.error||'Fehler'));
    else showToast('Snapshot ok · '+(j.mode||''));
  }catch(e){ pre.textContent='Fehler: '+e; showToast('Spektrum-Fehler'); }
}
function downsampleSpectrum(arr, maxPts) {
  if (!arr || !arr.length) return [];
  if (arr.length <= maxPts) return arr.slice();
  const out=[]; const step=arr.length/maxPts;
  for (let i=0;i<maxPts;i++) {
    const a=Math.floor(i*step), b=Math.min(arr.length, Math.floor((i+1)*step));
    let m=-1e9; for (let j=a;j<b;j++) if (arr[j]>m) m=arr[j];
    out.push(m);
  }
  return out;
}
function drawSpectrumCanvas(specDb, peaks, centerMhz, binHz) {
  const cv=document.getElementById('specCanvas');
  if (!cv || !specDb || !specDb.length) { if (cv) cv.style.display='none'; return; }
  cv.style.display='block';
  const ctx=cv.getContext('2d');
  const W=cv.width, H=cv.height;
  ctx.fillStyle='#050d1a'; ctx.fillRect(0,0,W,H);
  const pts=downsampleSpectrum(specDb, W);
  let mn=Infinity, mx=-Infinity;
  for (const v of pts) { if (v<mn) mn=v; if (v>mx) mx=v; }
  if (!(mx>mn)) { mn-=1; mx+=1; }
  ctx.strokeStyle='#3a8fd4'; ctx.lineWidth=1; ctx.beginPath();
  for (let i=0;i<pts.length;i++) {
    const y=H-4-((pts[i]-mn)/(mx-mn))*(H-8);
    if (i===0) ctx.moveTo(i,y); else ctx.lineTo(i,y);
  }
  ctx.stroke();
  if (peaks && peaks.length && centerMhz!=null && binHz) {
    ctx.fillStyle='#e8b84a';
    const n=specDb.length;
    const f0=centerMhz - (n/2)*binHz/1e6;
    for (const pk of peaks.slice(0,12)) {
      const f=pk.freq_mhz!=null?pk.freq_mhz:pk.freq;
      if (f==null) continue;
      const idx=(f-f0)/(binHz/1e6);
      const x=Math.round(idx/n*W);
      if (x>=0 && x<W) { ctx.fillRect(x,2,2,H-4); }
    }
  }
}
function renderSpectrumResult(j) {
  const data = (j && j.data) ? j.data : j;
  const pre=document.getElementById('specPre');
  const mode=data && data.mode;
  const ok=data && data.ok;
  const peaks=(data && data.peaks) || [];
  const summary={
    ok: !!ok,
    mode: mode||'–',
    center_mhz: data && data.center_mhz,
    ppm: data && data.ppm,
    gain: data && data.gain,
    peak_count: peaks.length,
    top_peaks: peaks.slice(0,8),
    windows_ok: data && data.windows_ok,
    windows_total: data && data.windows_total,
    candidates: data && (data.candidates||[]).slice(0,10),
    error: data && data.error,
  };
  pre.textContent=JSON.stringify(summary,null,2);
  drawSpectrumCanvas(data && data.spectrum_db, peaks, data && data.center_mhz, data && data.bin_hz);
}
async function loadSpectrumLast() {
  try{const r=await fetch('/api/spectrum/last');const j=await r.json();
    const data = j.data || j;
    renderSpectrumResult(data);
  }catch(e){document.getElementById('specPre').textContent='Fehler: '+e;}
}
async function loadDabScan() {
  try{const r=await fetch('/api/dab/scan/last');const j=await r.json();
    document.getElementById('dabScanBlock').innerHTML='<pre style="font-size:11px;white-space:pre-wrap">'+JSON.stringify(j,null,2)+'</pre>';}catch(e){}
}
async function loadPpmFromRuntime() {
  try{
    const r=await fetch('/api/runtime'); const j=await r.json();
    const ppm = j.settings && j.settings.ppm_correction;
    if (ppm != null && ppm !== '-') document.getElementById('ppmVal').value = ppm;
  }catch(e){}
}
async function ppmCalibrate() {
  const hint = document.getElementById('ppmHint');
  if (hint) hint.textContent = 'Kalibriere…';
  try{
    const r = await fetch('/api/ppm_calibrate', {method:'POST'});
    const j = await r.json();
    if (!j.ok) { showToast('PPM: '+(j.error||'Fehler')); return; }
    if (hint) hint.textContent = (j.ppm_found || j.hint || j.raw || 'fertig').toString().substring(0,120);
    const m = (j.ppm_found||'').match(/([-+]?\d+\.?\d*)/);
    if (m) document.getElementById('ppmVal').value = m[1];
  }catch(e){ if (hint) hint.textContent = 'Fehler: '+e; }
}
function onBaseRefresh() { loadDabStatus(); }
loadDabStatus(); loadRtlsdr(); loadPpmFromRuntime();
</script>{% endblock %}
