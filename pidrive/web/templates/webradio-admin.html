{% extends "base.html" %}
{% block title %}PiDrive — Webradio Verwaltung{% endblock %}
{% block content %}
<div class="card">
  <div class="card-title">📶 Webradio-Sender
    <span id="snapWr" style="font-weight:normal;color:var(--muted);text-transform:none;letter-spacing:0;font-size:11px"></span>
  </div>
  <div id="stationList" style="font-size:13px">Lade…</div>
</div>
<div class="card">
  <div class="card-title">➕ Sender hinzufügen</div>
  <div style="display:flex;flex-direction:column;gap:6px;max-width:400px">
    <input id="addName" placeholder="Name" style="background:var(--panel);border:1px solid var(--line);color:var(--text);padding:7px">
    <input id="addUrl" placeholder="Stream-URL" style="background:var(--panel);border:1px solid var(--line);color:var(--text);padding:7px">
    <button class="btn primary" onclick="addStation()">Hinzufügen</button>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="/static/js/page-webradio-admin.js"></script><script>
async function loadStations() {
  try{const r=await fetch('/api/webradio/stations');const j=await r.json();
    const stations=(j.stations)||((j.data&&j.data.stations))||[];
    const el=document.getElementById('stationList');
    const snap=document.getElementById('snapWr');
    if (snap) snap.textContent = '· Stand ' + new Date().toLocaleTimeString();
    if(!stations.length){el.innerHTML='<span style="color:var(--muted)">Keine Sender</span>';return;}
    el.innerHTML=stations.map(s=>{
      const id=(s.id||'').replace(/'/g,"\\'");
      const en=s.enabled!==false;
      return `<div style="display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line-soft)">
      <span style="flex:1;opacity:${en?1:0.45}"><b>${s.name}</b>${en?'':' <span style="color:var(--muted)">(aus)</span>'}<br><span style="color:var(--muted);font-size:11px">${(s.url||'').substring(0,50)}</span></span>
      <button class="btn" onclick="sendCmd('play_web:${(s.name||'').replace(/'/g,"\\'")}')">▶ Play</button>
      <button class="btn" onclick="toggleStation('${id}')">${en?'Disable':'Enable'}</button>
      <button class="btn" onclick="deleteStation('${id}')">🗑</button>
    </div>`;}).join('');}catch(e){showToast('Webradio laden fehlgeschlagen');}
}
async function toggleStation(id) {
  if (!id) { showToast('Keine Station-ID'); return; }
  try{
    const r=await fetch('/api/webradio/toggle',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id})});
    const j=await r.json();
    if (!j.ok) { showToast(j.error||'Toggle fehlgeschlagen'); return; }
    showToast(j.enabled ? 'Aktiviert' : 'Deaktiviert');
    loadStations();
  }catch(e){showToast('Toggle-Fehler');}
}
async function deleteStation(id) {
  if (!id) return;
  if (!confirm('Sender wirklich löschen?\n'+id)) return;
  try{
    const r=await fetch('/api/webradio/delete',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id})});
    const j=await r.json();
    if (!j.ok) { showToast(j.error||'Löschen fehlgeschlagen'); return; }
    showToast('Gelöscht');
    loadStations();
  }catch(e){showToast('Delete-Fehler');}
}
async function addStation() {
  const name=document.getElementById('addName').value;
  const url=document.getElementById('addUrl').value;
  if(!name||!url){showToast('Name und URL nötig');return;}
  try{
    const r=await fetch('/api/webradio/add',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name,url})});
    const j=await r.json();
    if (!j.ok) { showToast(j.error||'Hinzufügen fehlgeschlagen'); return; }
    showToast('Sender hinzugefügt');
    document.getElementById('addName').value='';
    document.getElementById('addUrl').value='';
    loadStations();
  }catch(e){showToast('Add-Fehler');}
}
let _wrTick = 0;
function onBaseRefresh() {
  _wrTick++;
  if (_wrTick % 5 === 1) loadStations();
}
loadStations();
</script>{% endblock %}
