name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: python3 -m pip install -r requirements-ci.txt

      - name: Offline CI suite
        run: bash tools/ci_offline.sh

  # Hinweise: HW-Suite (pidrivectl test all) braucht Pi + RTL/BT — nicht hier.
  # Optional später: self-hosted runner Job "hw-smoke".
